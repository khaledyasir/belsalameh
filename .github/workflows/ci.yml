name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm ci` runs the postinstall (`prisma generate`); this is a safety net.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npx next build
